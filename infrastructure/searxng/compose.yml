name: asku-searxng

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: asku-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:18888:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:18888/
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
