[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asku-knowledge"
version = "0.1.0"
description = "AskU campus knowledge ingestion and governance pipeline"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "lxml>=5,<7",
    "psycopg[binary,pool]>=3.2,<4",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
cleaning = [
    "PyMuPDF>=1.26,<2",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "xlrd>=2,<3",
    "olefile>=0.47,<1",
    "striprtf>=0.0.29,<1",
]

[tool.setuptools.packages.find]
include = ["asku*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
