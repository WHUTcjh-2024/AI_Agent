# ---------------------------------------------------------------
# 低价值信号（§9）：命中即降权，不因为这些词就直接判定 NO_RAG，
# 但如果正文不含学生政策/流程/条件，则不进主 RAG。
# ---------------------------------------------------------------
low_value_keywords:
  - 领导视察
  - 莅临
  - 调研指导
  - 党建工作
  - 党史学习
