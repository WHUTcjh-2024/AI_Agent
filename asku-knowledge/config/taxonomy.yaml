  - APPLICATION_MATERIAL
  - CALENDAR
  - PROGRAM_PLAN
  - RESULT_ANNOUNCEMENT
  - SERVICE_GUIDE
  - CONTACT_INFORMATION
  - INDEX_PAGE
  - SOURCE_DISCOVERY
  - NEWS_RELEVANT
  - OTHER

# INDEX_PAGE / SOURCE_DISCOVERY 只用于发现和增量，默认不进正式 RAG（§8）
non_rag_document_types:
  - INDEX_PAGE
  - SOURCE_DISCOVERY

# 重点知识类型（§8），质量分加权
key_document_types:
  - POLICY_REGULATION
  - ANNUAL_NOTICE
  - DEADLINE_NOTICE
  - PROCEDURE_GUIDE
  - PROGRAM_PLAN
  - FORM_TEMPLATE
  - APPLICATION_MATERIAL

audiences:
  - UNDERGRADUATE
  - GRADUATE
  - FRESHMAN
  - PROSPECTIVE
  - TEACHER
  - ALL
  - UNKNOWN

