# Taxonomy — 稳定分类体系
#
# §6：每篇有效知识必须至少有 school_id / education_level / primary_module /
#     secondary_topic / document_type / audience。
#     secondary_topic 使用稳定 slug，禁止每篇文档动态创造新的随意分类。
# §25：只有需要运行时过滤的维度才下沉为 WeKnora Tag。

version: 1

education_levels:
  - UNDERGRADUATE
  - GRADUATE
  - BOTH
  - PROSPECTIVE
  - UNKNOWN

primary_modules:
  - UNDERGRAD_ACADEMIC
  - GRADUATE_ACADEMIC
  - STUDENT_AFFAIRS
  - EXAM_CERTIFICATION
  - CAMPUS_LIFE
  - FRESHMAN
  - INNOVATION
  - CAREER
  - INTERNATIONAL
  - COLLEGE_SPECIFIC
  - OTHER

# 稳定 slug。分类只能落到这里面，落不进去则 OTHER + UNCERTAIN。
secondary_topics:
  other:                    # 无法稳定归类；必须保持 UNCERTAIN / NO_RAG
    primary_module: OTHER
    priority: P2
  recommendation:           # 推免 / 保研（P0）
    primary_module: UNDERGRAD_ACADEMIC
    priority: P0
  transfer_major:           # 转专业（P0）
    primary_module: UNDERGRAD_ACADEMIC
    priority: P0
  scholarship:              # 奖学金（P0）
    primary_module: STUDENT_AFFAIRS
    priority: P0
  comprehensive_evaluation: # 综测（P0）
    primary_module: STUDENT_AFFAIRS
    priority: P0
  cet:                      # 四六级（P0）
    primary_module: EXAM_CERTIFICATION
    priority: P0
  student_status:           # 学籍
    primary_module: UNDERGRAD_ACADEMIC
    priority: P0
  course_selection:         # 选课
    primary_module: UNDERGRAD_ACADEMIC
    priority: P0
  exam:                     # 考试
    primary_module: EXAM_CERTIFICATION
    priority: P0
  makeup_retake:            # 补考 / 重修
    primary_module: UNDERGRAD_ACADEMIC
    priority: P0
  graduation:               # 毕业要求
    primary_module: UNDERGRAD_ACADEMIC
    priority: P1
  degree:                   # 学位要求
    primary_module: UNDERGRAD_ACADEMIC
    priority: P1
  program_plan:             # 培养方案
    primary_module: UNDERGRAD_ACADEMIC
    priority: P0
  graduate_training:        # 研究生培养
    primary_module: GRADUATE_ACADEMIC
    priority: P0
  graduate_degree:          # 研究生学位
    primary_module: GRADUATE_ACADEMIC
    priority: P0
  thesis_review:            # 论文送审
    primary_module: GRADUATE_ACADEMIC
    priority: P0
  defense:                  # 答辩
    primary_module: GRADUATE_ACADEMIC
    priority: P0
  graduate_scholarship:     # 研究生奖学金
    primary_module: GRADUATE_ACADEMIC
    priority: P1
  freshman:                 # 新生入学
    primary_module: FRESHMAN
    priority: P1
  campus_card:              # 校园卡
    primary_module: CAMPUS_LIFE
    priority: P1
  campus_network:           # 校园网
    primary_module: CAMPUS_LIFE
    priority: P1
  library:                  # 图书馆
    primary_module: CAMPUS_LIFE
    priority: P1
  academic_calendar:        # 校历
    primary_module: CAMPUS_LIFE
    priority: P1
  holiday:                  # 放假
    primary_module: CAMPUS_LIFE
    priority: P2
  competition:              # 竞赛
    primary_module: INNOVATION
    priority: P1
  innovation_project:       # 大创
    primary_module: INNOVATION
    priority: P1
  career_procedure:         # 就业手续
    primary_module: CAREER
    priority: P1
  international:            # 国际交流
    primary_module: INTERNATIONAL
    priority: P2
  discipline:               # 处分 / 违纪
    primary_module: STUDENT_AFFAIRS
    priority: P2
  dorm:                     # 宿舍
    primary_module: CAMPUS_LIFE
    priority: P2
  medical:                  # 校医院 / 医保
    primary_module: CAMPUS_LIFE
    priority: P2
  financial_aid:            # 助学金 / 资助
    primary_module: STUDENT_AFFAIRS
    priority: P1
  party_youthleague:        # 党团 / 团委
    primary_module: STUDENT_AFFAIRS
    priority: P2

document_types:
