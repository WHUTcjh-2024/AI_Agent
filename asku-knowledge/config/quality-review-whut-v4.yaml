      - [材料学院2019-2020学年综测通知要求转专业学生在哪完成测评？, 转专业学生应在原学院原班级完成, 应由原辅导员完成学生的综合素质测评工作, 在原学院原班级完成；辅导员变更时由原辅导员办理, 原学院原班级]
      - [材料学院2019-2020学年综测的疫情体测特殊计分是多少？, 因受疫情影响，学校体质健康评定工作未能如期举行, 体质健康评定标准统一按2.5分计, 该历史学年的特殊安排为统一按2.5分计，不适用于当前学年, 2.5分]
