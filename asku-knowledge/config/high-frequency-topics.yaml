version: 1
school_id: whut
as_of: '2026-09-05'
coverage_target: 0.90
coverage_unit: evidence_reviewed_question
# IDs reuse taxonomy.yaml. Question IDs retain separate exam concepts.
budgets:
  max_listing_pages: 100
  max_pages_per_topic: 500
  max_pages_total: 500
  max_attachments_total: 650
  max_depth: 4
  max_file_size_mb: 30
  max_runtime_seconds: 3600
topics:
