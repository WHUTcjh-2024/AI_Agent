# SourceRegistry — 武汉理工官方公开来源登记表
#
# 约束 #3：只有登记在本文件且 active=true 的 official 域名才会被抓取。
#         站外链接（微信、微博、新闻门户等）只写入 knowledge.candidate_sources，
#         作为候选来源记录，绝不自动继续抓取。
# §5：Source Discovery 从学校主页 / 组织机构 / 学院列表 / 栏目页自动发现，
#     新发现的 *.whut.edu.cn 官方子域可由 Discovery 自动登记进来。
#
# 字段对齐 knowledge.sources 契约：
#   source_key → sources.id 后缀；name → source_name；
#   authority_type → authority；official_url → official_url。

version: 1
school_id: whut

sources:

  # ---------------- P0：核心学生业务域 ----------------
  - source_key: jwc
    name: 本科生院 / 教务处
    department: 本科生院
    base_url: https://jwc.whut.edu.cn/
    domains: [jwc.whut.edu.cn]
    authority_type: OFFICIAL_DEPARTMENT
    priority: P0
    education_level: UNDERGRADUATE
    active: true
    name_confirmed: false
    discovered_from: homepage

