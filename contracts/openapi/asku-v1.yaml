openapi: 3.1.0
info:
  title: AskU API
  version: 0.5.0
  description: AskU stable mobile contract. WeChat, WeKnora, Web Search and LLM remain adapter boundaries.
servers:
  - url: http://localhost:18080
paths:
  /healthz:
    get:
      summary: PostgreSQL, Redis and SchoolContext health
      responses:
        "200": { description: Healthy }
        "503": { description: Dependency unavailable }
  /v1/auth/dev-login:
    post:
      summary: Development-only test login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                externalId: { type: string }
                nickname: { type: string }
      responses:
        "200": { description: Access token, refresh token and user }
  /v1/auth/refresh:
    post:
      summary: Rotate refresh token
      responses:
        "200": { description: New token pair }
  /v1/auth/wechat:
    post:
      summary: Reserved WeChat Open Platform exchange endpoint
      responses:
        "501": { description: WeChat credentials not configured }
  /v1/me:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current user }
  /v1/sessions:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Session list with messages }
    post:
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Session created }
    delete:
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: All current-user sessions deleted }
  /v1/sessions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Session and messages }
    delete:
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Session deleted }
  /v1/sessions/{id}/messages:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      responses:
        "202": { description: User message and AgentRun created }
  /v1/runs/{id}/events:
    get:
      summary: Replayable SSE event stream
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: text/event-stream; see contracts/events/chat-events.md
  /v1/runs/{id}/cancel:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Cancellation requested }
  /v1/sources/{id}:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Source detail }
  /v1/feedback:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Feedback persisted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
